# test-media/manifest.toml — corpus v0 (W0-05; SPEC §13 Sources, §17 Corpus).
#
# One [[file]] row per media file the tests and benchmarks read. Fields:
#   id        stable name used by tests, goldens and stream-sources.toml
#   class     corpus    — self-made or public, bytes reproducible from `recipe`
#             lab-only  — AJ's full-length sources
#             window    — 1440p window intermediates the golden cuts were rendered from
#             golden    — the private set: the 11 golden cuts' plan, spec, receipt,
#                         ASS, heard.json, holds and reference MP4
#   path      `lab:<path>` (in the lab media folder: GMCLIP_LAB_MEDIA, default
#             ~/Development/gmclip-lab-media, made by tools/lab_media.sh), absolute, or
#             relative to this directory (corpus files live in local/, git-ignored)
#   size, sha256   of the bytes; `cargo xt corpus verify` checks both
#   goldens   (optional) the committed tools/make_goldens.py output for this file
#   corpus rows also carry: recipe, licence, r2
#
# `cargo xt corpus verify` passes when every row's file is present with its size and
# sha256 (`--skip-missing` for a machine without the lab sources). Nothing here is
# uploaded: every `r2` is "TODO" until AJ creates the bucket (STATUS.md, Needs AJ).
#
# Not listed yet:
# - (e) 8 h 1080p60 OBS MKV x264 keyint 120 without cues (SPEC §13): not on the M4 Pro
#   (searched 2026-10-14); AJ to point at one (STATUS.md, Needs AJ).
# - (c), (d) trims: M2. BENCH-60-M0's generated plan: H-15.
#
# Regenerate: `tools/make_corpus.sh` (corpus rows), `tools/make_goldens.py` (goldens/).
# The lab rows at the end are kept by hand.

schema = "gmclip.test-media/0"

[corpus]
# The ffmpeg build that produced the corpus bytes and the goldens. Another build may
# encode different bytes: rerun make_corpus.sh, make_goldens.py, and update the rows.
ffmpeg = "ffprobe version 8.1.2 (Homebrew), libx264, libvpx-vp9, native aac"
# First line of `ffmpeg -version`/`ffprobe -version` without the copyright: make_corpus.sh
# and make_goldens.py refuse another build unless told to accept it.
ffmpeg_version = "ffmpeg version 8.1.2"
ffprobe_version = "ffprobe version 8.1.2"
made_on = "AJ's M4 Pro, 2026-10-14"

[consent]
# The golden rows and the lab-only sources are AJ's own streams and shipped cuts.
# They stay on the lab machines (M4 Pro, Air), are never uploaded or committed (only
# their hashes are), and are used only to test gmclip. Corpus rows synthesised from
# lavfi test sources (b′, edit-list MOV, zoo, VFR) carry no personal content; (a′) is a
# 3-minute stream-copy trim of AJ's public Oct-01 restream.
status = "pending AJ's OK (SPEC §21.1, W0-09)"


