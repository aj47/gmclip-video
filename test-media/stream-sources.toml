# stream-sources.toml (W0-12, SPEC §5.16): where each lab stream's picture and audio come
# from. Paths are relative to the lab media folder (GMCLIP_LAB_MEDIA, default
# ~/Development/gmclip-lab-media; `tools/lab_media.sh` makes it). Checked by
# `cargo xt stream-sources`; `cargo xt bench60` reads it.
#
# - `mode = "native"`: one file on the stream's own clock carries picture and audio.
# - `mode = "hires_mkv"`: picture from the 1440p VP9 MKV (b) at a frame offset, audio
#   from the stream's 720p proxy, which is on the native clock (the proxy's own
#   timeline *is* native time): two-source parts, picture by MKV frame index, audio by
#   proxy sample index (SPEC §5.16).
#
# Picture offset. `[[source.window]]` rows are the ten measured alignment windows (audio
# xcorr, then frame MAE over ±8 frames; `hires/alignment.json`): -503 frames for the
# windows at 195 s and 278 s, -1642 from 1201 s (the reference renders cut windows down
# to 1196 s at -1642). The boundary between the regimes was not measured; SPEC §5.16
# puts it at ~1000 s, so `[[source.offset]]` splits there. Native time inside a
# `[[source.unmeasured]]` span is unverified: a plan must say so rather than trust either
# offset there.
#
#   mkv_frame(t) = round_half_even(t * fps) + offset_at(t)
#   offset_at(t) = frames of the [[source.offset]] with from_s <= t < until_s
#
# sha256s are the bytes on AJ's M4 Pro; each file is also a row of
# test-media/manifest.toml (`*_manifest_id`), and `cargo xt stream-sources` requires the
# two to agree.

schema = "gmclip.stream-sources/0"
fps = 30

[provenance.alignment]
path = "hires/alignment.json"
sha256 = "d456091f94c6055665e7e124c60e53ea3b746de5af0974fb89f680296eedbfb7"

[[source]]
vid = "loc_4fadb756"
mode = "hires_mkv"
# (b): jMcAmooE53I source.mkv, VP9 Profile 0 1440p30 with cues. Its own audio is AAC
# 44.1 kHz and is not used; audio comes from the 48 kHz proxy (the audio member).
picture_path = "streams/jMcAmooE53I-source.mkv"
picture_manifest_id = "b"
picture_sha256 = "13ed3a2671ad918f9e1f79dea18e2b44d30a4293ce106ae44e3bbbfa3f2ddb48"
picture_size = [2560, 1440]
audio_path = "preview/loc_4fadb756.proxy.mp4"
audio_manifest_id = "proxy-loc_4fadb756"
audio_sha256 = "ad8e69cda5ba9dc10624bbd19a86cb9544a2d7c458952b6e53bf316e78deaa2d"
audio_sample_rate = 48000
# Codecs, for a plan's sources[].expect.
picture_codec = "vp9"
audio_codec = "aac"
audio_channels = 2
# The inner unmeasured span as single keys; [[source.unmeasured]] below lists every span.
unmeasured_from_s = 307.0
unmeasured_until_s = 1196.0

[[source.unmeasured]]
from_s = 0.0
until_s = 195.0
# before the first alignment window

[[source.unmeasured]]
from_s = 307.0
until_s = 1196.0
# between the -503 and -1642 measurements

[[source.offset]]
