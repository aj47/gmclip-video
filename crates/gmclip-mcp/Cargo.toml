[package]
name = "gmclip-mcp"
description = "MCP adapter: socket server, task tools, discovery, command_run, auth, owner path."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
cap-std.workspace = true
getrandom.workspace = true
gmclip-core.workspace = true
gmclip-model.workspace = true
gmclip-proto.workspace = true
hmac.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true

# Unix: umask, getuid, getppid for the socket.
[target.'cfg(unix)'.dependencies]
rustix.workspace = true

# Windows: the named pipe, its DACL and the peer checks (decisions/0019).
[target.'cfg(windows)'.dependencies]
gmclip-platform.workspace = true

[dev-dependencies]
proptest.workspace = true
rmcp = { workspace = true, features = ["client", "transport-child-process"] }

[lints]
workspace = true
